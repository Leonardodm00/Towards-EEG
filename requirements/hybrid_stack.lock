# hybrid_stack.lock -- pinned environment for the Towards-EEG hybrid scheme.
#
# ONE lockfile, not two. TEEG_03 section 3.2 specifies "two lockfiles ...
# NEURON/LFPy/hybridLFPy and NEST have historically conflicting pins". Measured
# on 21 July 2026 that conflict DOES NOT HOLD at current versions: pip resolves
# both stacks into a single environment and reports "No broken requirements
# found", and all eleven third-party modules the package imports load in one
# process. See s08_exit_scope.json finding H-8 for the evidence.
#
# One lockfile is also what the CODE requires. towards_eeg/hybrid/driver.py
# imports neuron at L39, nest at L41 and hybridLFPy at L43, in that order, and
# its own comments say so: "NEURON compiled with MPI must be imported before
# NEST and mpi4py" and "Import not used, but done in order to ensure correct
# execution". The two stacks are not merely both required, they must be
# CO-RESIDENT IN ONE PROCESS. Two environments could not run driver.py at all.
#
# WHAT THIS FILE IS NOT
# ---------------------
# It is NOT the HPC freeze that B-4 blocks on. It was produced in a clean
# Linux venv from PyPI wheels, NOT in the davinci conda environment, and two
# of its entries are actively WRONG for an HPC node:
#
#   openmpi==5.0.10   a PyPI-wheel MPI runtime. On a cluster MPI comes from a
#                     module and must match the interconnect; a pip-installed
#                     MPI will not use the high-speed fabric and may not work
#                     with the scheduler's mpirun at all.
#   neuron==9.0.1     the PyPI wheel is NOT built with MPI. driver.py L39
#                     requires "NEURON compiled with MPI". On davinci NEURON is
#                     therefore expected to be a module, not this wheel.
#
# So this is a REFERENCE environment: it proves the dependency graph is
# satisfiable and the stack importable, and it is what CI should use. B-4
# remains open for the cluster. The commands to close it are in
# s08_exit_scope.json under b4_what_remains.
#
# Generated by pip resolution on 2026-07-21; python 3.12.3, Linux-6.18.5-x86_64-with-glibc2.39.
# Every artefact is pinned by version AND sha256, so `pip install
# --require-hashes -r requirements/hybrid_stack.lock` is reproducible.
#
# hybridLFPy 0.2 needs --no-build-isolation and poetry-core preinstalled; it is
# an sdist that declares no build requirements but whose backend is poetry.
# See s08_exit_scope.json finding H-9.

