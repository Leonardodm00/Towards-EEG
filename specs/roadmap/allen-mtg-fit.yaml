  - id: I3
    title: "Phase 2.5 and Phase 3"
    summary: "Phase 2.5 refits C_m and R_m with R_a fixed at the cohort median; Phase 3 gives bootstrap confidence intervals on a subset of cells (B = 200, local GP refits)."
    parent: G2
    depends_on: [I2]
    needs_theory: [T3]
    needs_hpc: true
    jobs: ["Passive Features/HPC script/Biological Fit/submit_biological_fit.sh"]
