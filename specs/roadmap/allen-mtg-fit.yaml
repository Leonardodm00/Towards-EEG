# Roadmap of the subproject allen-mtg-fit: the optimisation pipeline that fits
# the Allen Institute MTG cells (passive fit, I_h fit, recording-noise law,
# synthetic recovery gate, campaign). Source of truth for the stages and the
# theory statuses; the implementation statuses are computed by
# specs/roadmap/roadmap.py (never written by hand) -- except the legacy stages
# marked manual_status below, which predate the SPEC: their status is the
# snapshot of 2026-10-23, with the evidence in manual_reason, and it stays
# until the SPEC gets an entry for them (then the manual lines go).
#
# Drafted on 2026-10-23 from Passive Features/HPC script/Ih Fit/specs/SPEC.md
# (Blocks 1-2), claude/TEEG_Ih_fit_staged_plan.md (Stages 0-9), the decision
# log (D-005 to D-017, D-028 to D-034, D-048 to D-056, D-072, D-073) and the
# cluster runs of 2026-10-20/21, and curated by the noise-fit chat. Lines
# marked DRAFT are the assistant's guesses for the user to confirm.
# 2026-10-26: S7 restated as the user asked (D-083), I4 done on the user's
# statement, N4b added (D-082), N3/N4 notes brought up to date.
#
# Theory status: open | studying | closed  (set with
#   python specs/roadmap/roadmap.py set --yaml specs/roadmap/allen-mtg-fit.yaml T5 closed --decision D-nnn)
# Implementation stages: block = the SPEC.md block; parent = the group the
# stage belongs to (a stage with members is drawn as a frame around them; a
# stage without a block is a pure group); needs_hpc = green only after an HPC
# run marked by specs/roadmap/hpc_status.sh; jobs = job script paths (from the
# repository root) or PBS job names (-N) whose markers belong to the stage;
# summary = what the stage is about, in plain words.
schema: 1
name: allen-mtg-fit
title: "Allen MTG cell fitting: passive fit, I_h fit, noise law, recovery gate (Passive Features/HPC script)"
repo: Leonardodm00/Towards-EEG
branch: main
spec: Passive Features/HPC script/Ih Fit/specs/SPEC.md
hpc_branch: hpc-status
stale_after_hours: 72      # a running HPC marker older than this is reported as failing (the gate run is hours, the campaign days)

theory:
  # ---- groups (no status of their own; coloured by their least advanced member)
  - id: TG1
    title: "Passive fit"
    summary: "The passive cable model and how its three parameters are fitted to the Allen recordings: the model, the data, the optimiser and its uncertainty, the validation gate."
    refs: []
    depends_on: []
  - id: TG2
    title: "Recording noise"
    summary: "The noise each real sweep carries and how a synthetic twin gets the same: the law, the window statistics, the indirect-inference fit, the tilt, the per-sweep calibration, the archive's own selection."
    refs: []
    depends_on: []
  - id: TG3
    title: "I_h fit"
    summary: "Adding the h-current to the fitted model: kinetics and their two fitted knobs, rest balance and dendritic distribution, the six-parameter protocol and loss, identifiability and the recovery gate."
    refs: []
    depends_on: []
  - id: TG4
    title: "Not yet tackled"
    summary: "Topics the chats have named but never studied: temperature transfer of the kinetics, the corrected morphologies as the fit's input, and how the campaign's arms are compared."
    refs: []
    depends_on: []

  # ---- passive fit (all studied, per the user 2026-10-23)
  - id: T1
    title: "Passive cable model and the three parameters"
    summary: "What C_m, R_m and R_a mean on a reconstructed arbour, the spine factor F on the distal membrane (F = 1.9 for L2/L3), and why a brief pulse carries C_m while a long step carries R_m and the time constant."
    refs: [Eyal 2016 (KB), D-004, D-007 C4, plan s.1 and s.6.3, phase1_conceptual_guide.md]
    parent: TG1
    depends_on: []
    status: closed        # the user, 2026-10-23: everything about the passive fit is studied
    closed_on: 2026-10-23
    decision:
  - id: T2
    title: "The Allen recordings and the archive"
    summary: "The Square Subthreshold and Long Square protocols, the liquid-junction correction, what the Phase-0 writer stores per cell, and how sweeps become bundles and roles."
    refs: [Allen white paper (KB), phase1_function_reference.md, D-006, D-007 C2, D-016]
    parent: TG1
    depends_on: []
    status: closed
    closed_on: 2026-10-23
    decision:
  - id: T3
    title: "Bayesian optimisation, likelihood profile and bootstrap intervals"
    summary: "How the fit searches the three log-parameters with a Gaussian-process optimiser, how a profile over one axis reads the loss landscape, and how Phase 3's bootstrap gives each parameter an interval."
    refs: ["Bayesian Optimisation and Likelihood Profile.md (KB)", "bootstrap CI papers (KB)", D-007 C5, D-010 (i)]
    parent: TG1
    depends_on: [T1, T2]
    status: closed
    closed_on: 2026-10-23
    decision:
  - id: T4
    title: "The validation gate"
    summary: "The absolute-mV gate that compares a held-out step with the training fit, why its two sides must use the same window, and what Allen's own R_in and tau_m can and cannot confirm."
    refs: [Biological_Passive_Fit_HPC_Guide.md s.8, D-010 (ii)]
    parent: TG1
    depends_on: [T3]
    status: closed
    closed_on: 2026-10-23
    decision:

  # ---- recording noise (studying now)
  - id: T5
    title: "The noise law"
    summary: "A fast AR(1) part, a slow Ornstein-Uhlenbeck part, and a per-sweep offset and tilt: what each term is, its autocovariance, and what the 265 ms and SS windows can and cannot see of it."
    refs: [SPEC 2.1, D-017, D-034, noise model doc s.3.3 and s.3.6]
    parent: TG2
    depends_on: [T2]
    status: studying
    closed_on:
    decision:
  - id: T6
    title: "Window statistics are not parameters"
    summary: "Why a window's SD and textbook autocorrelation depend on the window length and the estimator, the visible share of a slow component, and the closed-form moments that start the fit."
    refs: [SPEC 2.2, D-028, D-029, noise model doc s.3.4, topic doc eqs. 7-10]
    parent: TG2
    depends_on: [T5]
    status: studying
    closed_on:
    decision:
  - id: T7
    title: "Indirect inference with simulated weights"
    summary: "Matching the cell's statistics to the medians of simulated windows, with the inverse of the simulated covariance as weight, iterated to a fixed point; what the S0-S3 checks test about it."
    refs: [SPEC 2.3, D-033, D-048, D-049, D-050, D-051, D-055, D-056]
    parent: TG2
    depends_on: [T6]
    status: studying
    closed_on:
    decision:
  - id: T8
    title: "The tilt and the semivariogram"
    summary: "Why the variance at seconds is carried by a per-sweep linear tilt rather than a third noise component, and how its spread is read from the window-mean semivariogram at one lag (4 periods, 0.802 s)."
    refs: [SPEC 2.4, D-034, D-051 (iii), topic doc eq. 25]
    parent: TG2
    depends_on: [T5, T6]
    status: studying
    closed_on:
    decision:
  - id: T9
    title: "Per-sweep calibration and shrinkage"
    summary: "What one sweep can identify of the law (the fast pair well, the slow SD roughly, the slow timescale not), and how a random-effects shrinkage lets each twin sweep carry its own real sweep's noise."
    refs: [D-073, sweep_identifiability.py, shrink_check.py, DerSimonian and Laird 2015 (PubMed full text)]
    parent: TG2
    depends_on: [T7, T8]
    status: studying      # explained 2026-10-21 and 2026-10-23; the per-sweep form is the user's open choice
    closed_on:
    decision:
  - id: T10
    title: "The archive's SS layout and the trace-QC selection"
    summary: "Each SS sweep is a 37-pulse train, 200.5 ms onset to onset; the stored windows are those that passed the writer's shape test; what that selection does to the noise statistics and why no shape test is added."
    refs: [D-072, SPEC 3 and 8, sqc_trace_qc_selection.py]
    parent: TG2
    depends_on: [T2]
    status: closed
    closed_on: 2026-10-21
    decision: D-072

  # ---- I_h fit (open)
  - id: T11
    title: "I_h kinetics and the two fitted knobs"
    summary: "The Kole/Hay and the Rich (human) activation curves, the shift of the activation curve and the scale of its time constant as fitted parameters, and what the published values anchor."
    refs: [plan s.6.1 and s.11.1, D-005, D-007 C1, Rich 2021 (KB), Kalmbach 2018 (PMC)]
    parent: TG3
    depends_on: [T1]
    status: open
    closed_on:
    decision:
  - id: T12
    title: "Rest balance and the dendritic distribution"
    summary: "Why the leak reversal is shifted so that the resting potential is an exact stationary state once I_h is inserted, and the uniform law against the Eyal/Hay exponential law."
    refs: [plan s.6.2, s.6.4, eqs. 11.2-11.3, D-005 Q2 and Q5]
    parent: TG3
    depends_on: [T11]
    status: open
    closed_on:
    decision:
  - id: T13
    title: "The six-parameter protocol and loss"
    summary: "The role table of the Long Square steps, the full-step window, the sag fraction as the signal that separates R_m from the h-conductance, and the loss's finite crash penalty."
    refs: [plan s.5, s.7, s.11.4-11.5, D-006, D-010]
    parent: TG3
    depends_on: [T2, T11]
    status: open
    closed_on:
    decision:
  - id: T14
    title: "Identifiability and the recovery gate"
    summary: "Whether six parameters are identified from these protocols, and the gate that tests it on synthetic twins: the error measures, the tolerances (the assistant's, unowned) and the cohort size (20, no power calculation)."
    refs: [plan s.12 and eq. 11.6, D-011, D-015, D-055]
    parent: TG3
    depends_on: [T13, T5]
    status: open
    closed_on:
    decision:

  # ---- not yet tackled (DRAFT: proposed by the assistant 2026-10-23; keep, merge or drop)
  - id: T15
    title: "Temperature and the transfer of kinetics"
    summary: "The Allen recordings are at 34 C, the human kinetics come from 32-34 C recordings and neither .mod file has a Q10: what a temperature mismatch does to the fitted time-constant scale."
    refs: [plan s.3 item 3]
    parent: TG4
    depends_on: [T11]
    status: open          # DRAFT
    closed_on:
    decision:
  - id: T16
    title: "Corrected morphologies as the fit's input"
    summary: "How the diameter-corrected arbours (the diameter-pipeline roadmap) change membrane area, electrotonic distance and therefore C_m and the sag, and whether F = 1.9 still holds on them."
    refs: [D-007 C4, D-013, plan s.12 bullet on morphologies]
    parent: TG4
    depends_on: [T1]
    status: open          # DRAFT
    closed_on:
    decision:
  - id: T17
    title: "Comparing the campaign's arms"
    summary: "How to decide that I_h improved the fit: baseline run B against the passive full-step control and the six-parameter arm on the identical protocol, with Phase-3 intervals, and what the population read-out may claim."
    refs: [plan s.5 (passive control arm), s.8 Stage 8 read-out, D-010 (ii)]
    parent: TG4
    depends_on: [T13, T14]
    status: open          # DRAFT
    closed_on:
    decision:

implementation:
  # ---- groups (no block of their own; coloured by their least advanced member)
  - id: G1
    title: "Data archive (Phase 0)"
    summary: "The Colab writer that downloads each Allen cell, repairs its morphology, extracts the SS pulses and LS sweeps and applies the trace QC."
    depends_on: []
    needs_theory: [T2]
  - id: G2
    title: "Passive fit (Biological Fit, Phases 1-3)"
    summary: "The production passive fit: loader, Bayesian-optimisation fit with the gate, Phase 2.5 and the bootstrap, and the synthetic benchmark that tested it."
    depends_on: []
    needs_theory: [T1, T3, T4]
  - id: G3
    title: "I_h fitter (Ih Fit, Stages 0-6)"
    summary: "The six-parameter fitter built as an edited copy of the monolith: the regression harness, the mechanism layer, the loader, the parameter vector, the protocol, Phase 3 and the orchestrator."
    depends_on: []
    needs_theory: [T11, T12, T13]
  - id: G4
    title: "Noise fit (SPEC Blocks 1-7)"
    summary: "The per-cell and per-sweep fit of the recording-noise law that the twins inject: statistics, simulator, windows, fit, generator term, driver and record."
    depends_on: []
    needs_theory: [T5, T6, T7, T8, T9, T10]
  - id: G5
    title: "Recovery gate and campaign (Stages 7-9)"
    summary: "The synthetic twins and the gate that decides whether the fitter recovers a known truth, then the campaign on the real cells and its record."
    depends_on: []
    needs_theory: [T14]

  # ---- Phase 0
  - id: I0
    title: "Phase-0 archive writer"
    summary: "Downloads a cell with AllenSDK, repairs the SWC, checks electrical viability, cuts the SS pulse windows and LS sweeps, runs the trace QC and writes specimen_<id>/ (ss_pulses.npz, ls_sweeps.npz, metadata.json, trace_qc_*)."
    parent: G1
    depends_on: []
    needs_theory: [T2]
    needs_hpc: false      # Colab, not the cluster
    jobs: []
    note: "Passive Features/Allen Institute Data/save_alleninstitute_data (6).py, trace_qc (1).py, trace_qc_v2.py. The L3_exc archive (18 cells) was written 2026-06-19; its SS layout and QC tables were read on 2026-10-20/21 (D-072). No SPEC entry: status set by hand."
    manual_status: done
    manual_reason: "the archive exists on davinci and Drive (18 L3_exc cells, 2026-06-19) and every cell carries its QC table (cluster check 2026-10-21, D-072); no SPEC entry"

  # ---- passive fit
