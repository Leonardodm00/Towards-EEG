    manual_reason: "used by run B and byte-identical oracle of the regression gate (PASS on a real cell, davinci 2026-10-20); no SPEC entry"
  - id: I2
    title: "Phase 2: Bayesian-optimisation fit with the gate (run B)"
    summary: "Fits (C_m, R_m, R_a) per cell with skopt's Gaussian-process optimiser on the SS pulses and the two smallest hyperpolarising steps (dt 0.1 ms, 60 ms window), applies the absolute-mV gate and writes phase2_results.csv."
    parent: G2
