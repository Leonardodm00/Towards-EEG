    needs_hpc: true
    jobs: ["Passive Features/HPC script/Synthetic Passive fit Test/submit_synth_benchmark.sh", "Passive Features/HPC script/Synthetic Passive fit Test/submit_all_cohorts.sh"]
    note: "Passive Features/HPC script/Synthetic Passive fit Test/: synthetic_ground_truth.py, synth_gt_grid.py, gen_from_manifest.py, run_synth_benchmark.py, aggregate_synth_results.py and their smoke suites. The user ran this synthetic check of the passive fit (statement of 2026-10-26, D-083); its results are not in the decision log. S7 is its six-parameter analogue."
    manual_status: done
    manual_reason: "the user ran the passive-only synthetic recovery (2026-10-26: 'the same synthetic check ... that I've done with the passive parameters only', D-083); no SPEC entry"

