# Roadmap of the subproject diameter-pipeline. Source of truth for the stages
# and the theory statuses; the implementation statuses are computed by
# specs/roadmap/roadmap.py (never written by hand).
#
# Drafted by `roadmap.py init` from specs/SPEC.md on 2026-10-22 and curated:
# the theory stages follow SPEC section 2 plus the topics of Blocks 12-15
# and the hybrid optics; the groups (TG1-TG3; G1-G5, and I4 holding I9) are
# a first reading of the structure, to confirm. Each implementation step
# (G2-G5) names its theory group in needs_theory; new blocks go under their
# step with `roadmap.py add block`, new topics under their group with
# `roadmap.py add topic`. Lines marked DRAFT are guesses.
#
# Theory status: open | studying | closed  (set with
#   python specs/roadmap/roadmap.py set --yaml specs/roadmap/diameter-pipeline.yaml T6 closed --decision D-nnn)
# Implementation stages: block = the SPEC.md block; parent = the group the
# stage belongs to (a stage with members is drawn as a frame around them;
# a stage without a block is a pure group); needs_hpc = green only after an
# HPC run marked by specs/roadmap/hpc_status.sh; jobs = job script paths or
# PBS job names (-N) whose markers belong to the stage; summary = what the
# stage is about, in plain words.
schema: 1
name: diameter-pipeline
title: "Allen dendrite-diameter re-measurement (allen_diameter)"
repo: Leonardodm00/Towards-EEG
branch: sci/diameter-pipeline
spec: specs/SPEC.md
hpc_branch: hpc-status
stale_after_hours: 48      # a running HPC marker older than this is reported as failing

theory:
  # ---- groups (no status of their own; coloured by their least advanced member)
  - id: TG1
    title: "Image formation"
    summary: "How a dendrite in the stack becomes the image we measure: frames, the phantom and its rendering, and the optics of absorption and defocus."
    refs: []
    depends_on: []
  - id: TG2
    title: "Measuring a diameter at a node"
    summary: "What is extracted from the image at one node and how: the per-node chain, the tube fit and the SGT plane fit."
    refs: []
    depends_on: []
  - id: TG3
    title: "Correction and calibration"
    summary: "How a measured diameter is corrected and the kernel calibrated: the bias table and inversion, the far-field calibration."
    refs: []
    depends_on: []

  # ---- topics
  - id: T1
    title: "Frames and objects"
    summary: "Stack, node and camera frames; the objects the measurement works on (SPEC 2.1)."
    refs: [SPEC 2.1, handoff_diameter_remeasurement.md]
    parent: TG1
    depends_on: []
    status: closed        # DRAFT: Blocks 2-5 confirmed and smoke-tested; confirm or reopen
    closed_on: 2026-10-06
    decision:
  - id: T2
    title: "Per-node measurement"
    summary: "Profile sampling, focus rule, path, background and the tube fit at a node (SPEC 2.2, handoff Eqs. 1-5, 9)."
    refs: [SPEC 2.2, D-018, D-019, D-030]
    parent: TG2
    depends_on: [T1]
    status: closed        # DRAFT
    closed_on: 2026-10-07
    decision: D-030
  - id: T3
    title: "Phantom geometry and rendering"
    summary: "Synthetic tubes, the blur kernel, the JPEG tables and the FFT renderer (SPEC 2.3, impl-handoff S1-S5, procedure Eqs. 5-6)."
    refs: [SPEC 2.3]
    parent: TG1
    depends_on: [T1]
    status: closed        # DRAFT
    closed_on: 2026-10-06
    decision:
  - id: T4
    title: "Bias table and correction"
    summary: "The table design, the local linear estimator and the inversion (SPEC 2.4, procedure Eqs. 1-3, 7, mathematics Eqs. 19-21)."
    refs: [SPEC 2.4, D-024, D-057, D-058, D-059, D-060, D-061, D-062, D-063, D-071]
    parent: TG3
    depends_on: [T2, T3]
    status: closed        # DRAFT: D-071 settled the [to confirm] items of Block 14
    closed_on: 2026-10-21
    decision: D-071
  - id: T5
    title: "Skewed generalized-t kernel and the plane fit"
    summary: "The SGT family, the seven-parameter fit at a plane and the Allen-guided plane iteration (Blocks 12-13)."
    refs: [D-052, D-053, D-054, D-061, D-064]
    parent: TG2
    depends_on: [T2]
    status: closed        # DRAFT
    closed_on: 2026-10-20
    decision: D-064
  - id: T6
    title: "Far-field calibration"
    summary: "The far scan and far fit that give Block 4's kernel its continuation slope (Block 15, S2b of the 2026-10-20 plan)."
    refs: [D-026, D-026.1, D-027, D-067.4, D-070, D-071.5]
    parent: TG3
    depends_on: [T3, T5]
    status: closed
    closed_on: 2026-10-26
    decision:
    note: "To study, in this order (the user, 2026-10-22): (1) 'S2b, the far-field calibration: how I would proceed', from its CONTEXT (diameter implementation chat, 2026-10-21; figures fig1_far_line, fig2_far_fit); (2) the explanation of its Statistic step, the two-pass core fit and the predicted-dip SNR rule (2026-10-22; figures fig1_twopass, fig2_selection); (3) the answer on the three roles of gamma, c and s in the far fit (F2) (2026-10-22)."
  - id: T7
    title: "Optics of the hybrid plane absorption and the defocus kernel"
    summary: "The optics needed to build the hybrid renderer: each slice's absorbed light taken from the condenser's rays (NA 1.4, n_oil 1.515, averaged over directions), then every image plane rendered by applying the defocus kernel to it, and the chain after it (I-004)."
    refs: [renderers doc 2026-10-09 s.3.8-3.9 Eqs. 13-14 on main, optics v1.5 s.3.3-3.7 on main, sine condition and W 2026-10-12 on main, procedure s.3.4 and s.3.6, D-024 (i), D-067.2, I-002, I-003, I-004]
    parent: TG1
    depends_on: [T3]
    status: open          # added 2026-10-22 at the user's request ("I need to study all the optics theory to construct the hybrid plane absorption ...")
    closed_on:
    decision:
    note: "No SPEC block yet: Block 4 renders with the partition (D-024 (i), for now); a hybrid would be a new absorption mode inside the simulation hash."

implementation:
  # ---- groups (no block of their own; coloured by their least advanced member)
  - id: G1
    title: "Foundations"
    summary: "The image-access modules imported from the 2026-09-23 code and the configuration every block reads."
    depends_on: []
    needs_theory: []
  - id: G2
    title: "Synthetic image model"
    summary: "Everything that turns a tube geometry into a rendered brightfield stack: geometry, blur kernel, JPEG tables, FFT renderer and the ray-world alternative."
    depends_on: []           # the members' own dependencies draw the arrows
    needs_theory: [TG1]     # the step's theory group
  - id: G3
    title: "Diameter measurement on real data"
    summary: "The per-node chain from an Allen stack to a diameter: profiles, focus, path, background, the tube fit, the SGT plane fit, the Allen-guided plane iteration, the cell-level run and the Phase II tools."
    depends_on: []           # the members' own dependencies draw the arrows
    needs_theory: [TG2]     # the step's theory group
  - id: G4
    title: "Bias table and correction"
    summary: "Rendered phantoms, the bias table, its inversion and the corrected diameters; the production table runs on davinci."
    depends_on: []           # the members' own dependencies draw the arrows
    needs_theory: [TG3]     # the step's theory group
  - id: G5
    title: "Kernel calibration"
    summary: "The calibration of the blur kernel on real nodes: first stage on the pilot, then the far-field scan and fit."
    depends_on: []           # the members' own dependencies draw the arrows
    needs_theory: [TG3]     # the step's theory group

  # ---- stages (one SPEC block each)
  - id: I0
    title: "Scaffolding and the 2026-09-23 image modules"
    summary: "Package layout and the four image modules (fetch, align, measure, plot) imported byte-identical from the September code, with their own test suites."
    block: 0
    parent: G1
    depends_on: []
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I1
    title: "Configuration"
    summary: "The dataclasses that hold every parameter of the pipeline, their defaults from the decisions, validation and the JSON round trip."
    block: 1
    parent: G1
    depends_on: []
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I2
    title: "Geometry"
    summary: "Tube geometry in the stack frame: axes, headings, offsets and the sections a phantom is built from (S1-S6)."
    block: 2
    parent: G2
    depends_on: []
    needs_theory: [T1, T3]
    needs_hpc: false
    jobs: []
  - id: I3
    title: "Forward model and fitter"
    summary: "The analytic profile of a blurred tube (handoff Eqs. 10-11) and the least-squares fitter that recovers diameter, centre and background from a measured profile."
    block: 3
    parent: G3
    depends_on: []           # also consumes Block 5's profile (a loop), not drawn
    needs_theory: [T2]
    needs_hpc: false
    jobs: []
  - id: I4
    title: "Renderer"
    summary: "Renders a geometry into a synthetic stack: the defocusing kernel, the camera model, the JPEG tables and the FFT convolution; the ray-world generator (I9) is its alternative absorption model."
    block: 4
    parent: G2
    depends_on: [I2, I3]
    needs_theory: [T3]
    needs_hpc: false
    jobs: []
  - id: I5
    title: "The shared per-node chain"
    summary: "The chain run on every node, real or synthetic: profile sampling, focus rule, path, background estimate and the fit, orchestrated by node_pipeline."
    block: 5
    parent: G3
    depends_on: [I0, I3, I4]
    needs_theory: [T2]
    needs_hpc: false
    jobs: []
  - id: I6
    title: "Phantoms and the bias table"
    summary: "Draws phantom tubes, renders and measures them, and estimates the bias table from the replicates; the production table is a PBS array on davinci."
    block: 6
    parent: G4
    depends_on: [I2, I4, I5]
    needs_theory: [T4]
    needs_hpc: true          # the production table runs on davinci (D-022)
    jobs: [diam_table, scripts/pbs/build_table.pbs]
  - id: I7
    title: "Inversion, flags, fill"
    summary: "Inverts the bias table to correct a measured diameter, flags the nodes the table cannot correct, and fills them from their neighbours."
    block: 7
    parent: G4
    depends_on: [I5, I6]
    needs_theory: [T4]
    needs_hpc: false
    jobs: []
  - id: I8
    title: "Cell level: SWC I/O, stretches, per-node CSV, membrane area"
    summary: "Runs a whole cell: reads the Allen SWC, picks the stretches, measures every node, writes the per-node CSV and the corrected SWC, and compares the membrane area with Allen's radii."
    block: 8
    parent: G3
    depends_on: [I5, I6, I7]
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I9
    title: "Ray-world generator"
    summary: "The ray-tracing absorption model selected by RendererConfig.absorption = ray_world, an independent check of the analytic renderer."
    block: 9
    parent: I4
    depends_on: [I2]
    needs_theory: [T3]
    needs_hpc: false
    jobs: []
  - id: I10
    title: "Kernel calibration, first stage"
    summary: "Fits the growth of the core width with distance from focus on thin real nodes, to calibrate the renderer's kernel (procedure Eq. 4)."
    block: 10
    parent: G5
    depends_on: [I3, I5, I6, I8]
    needs_theory: [T3]
    needs_hpc: false
    jobs: []
  - id: I11
    title: "Phase II tools: pilot, registration survey, camera inputs, Colab bootstrap"
