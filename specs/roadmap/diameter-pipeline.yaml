  - id: I0
    title: "Scaffolding and the 2026-09-23 image modules"
    block: 0
    depends_on: []
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I1
    title: "Configuration"
    block: 1
    depends_on: []
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I2
    title: "Geometry"
    block: 2
    depends_on: []
    needs_theory: [T1, T3]
    needs_hpc: false
    jobs: []
  - id: I3
    title: "Forward model and fitter"
    block: 3
    depends_on: []           # also consumes Block 5's profile (a loop), not drawn
    needs_theory: [T2]
    needs_hpc: false
    jobs: []
  - id: I4
    title: "Renderer"
    block: 4
    depends_on: [I2, I3]
    needs_theory: [T3]
    needs_hpc: false
    jobs: []
  - id: I5
