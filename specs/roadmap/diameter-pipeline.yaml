    parent: G3
    depends_on: [I0, I4, I5, I6, I7, I8, I10]
    needs_theory: []
    needs_hpc: false         # Colab, not the cluster
    jobs: []
  - id: I12
    title: "SGT kernel and the seven-parameter fit at a plane"
    summary: "The skewed generalized-t blur family and the seven-parameter fit of a single plane's profile (D-052 to D-054)."
    block: 12
    parent: G3
    depends_on: [I5]
    needs_theory: [T5]
    needs_hpc: false
    jobs: []
  - id: I13
    title: "Allen-guided plane and the SGT fit inside the per-node chain"
    summary: "The plane iteration guided by Allen's diameter, the shared scene and square, and the SGT fit at the chosen plane, wired into measure_node."
    block: 13
    parent: G3
    depends_on: [I3, I5, I11, I12]
    needs_theory: [T5]
    needs_hpc: false
    jobs: []
  - id: I14
    title: "The table under D-058 to D-063: design, coordinates, estimator, inversion, jobs"
    summary: "The redesigned bias table: the draw design and coordinates, the local linear estimator, the inversion, and the PBS array that produces it."
    block: 14
    parent: G4
    depends_on: [I6, I7, I13]
    needs_theory: [T4]
    needs_hpc: true          # the PBS array of scripts/pbs/build_table.pbs
    jobs: [diam_table, scripts/pbs/build_table.pbs]
  - id: I15
    title: "Far-field calibration"
    summary: "The far scan over nodes far from focus and the far fit that fix the kernel's continuation slope (S2b, D-026)."
    block: 15
    parent: G5
    depends_on: [I5, I10, I13]
    needs_theory: [T6]
    needs_hpc: false
    jobs: []
  - id: S3
    title: "Phase II on Allen's data (Colab)"
    summary: "The runs on the real cells that come before the production table (S3 of the plan of 2026-10-20; D-065, D-067): the coverage survey, the simulator's inputs, the kernel calibration on Allen's nodes and the final configuration."
    parent:
    depends_on: []
    needs_theory: []
    needs_hpc: false
