    depends_on: [T1]
    status: closed        # DRAFT
    closed_on: 2026-10-06
    decision:
  - id: T4                # a group since 2026-10-27: T4.1-T4.3 below (no status of its own)
    title: "Bias table and correction"
    summary: "The table design, the local linear estimator and its SE, the read-out and the inversion (SPEC 2.4, procedure Eqs. 1-3, 7, mathematics Eqs. 19-21)."
