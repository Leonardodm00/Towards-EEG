# Roadmap of the subproject diameter-pipeline. Source of truth for the stages
# and the theory statuses; the implementation statuses are computed by
# specs/roadmap/roadmap.py (never written by hand).
#
# Drafted by `roadmap.py init` from specs/SPEC.md on 2026-10-22 and curated:
# the theory stages follow SPEC section 2 plus the topics of Blocks 12-15
# and the hybrid optics; the groups (TG1-TG3; G1-G5, and I4 holding I9) are
# a first reading of the structure, to confirm. Each implementation step
# (G2-G5) names its theory group in needs_theory; new blocks go under their
# step with `roadmap.py add block`, new topics under their group with
# `roadmap.py add topic`. Lines marked DRAFT are guesses.
#
# 2026-10-26: the steps still to do added with `roadmap.py add step`, DRAFT
# until the user confirms them: S3 (with S3a-S3d), S5, S6, S7, S8 and S9 from
# the plan of 2026-10-20 (D-065, D-067), and NS1-NS2, not scheduled. Each step
# has a theory part of its own, its paired group TS<k> (NS2, now HR: T7) -- the
# user's rule of 2026-10-26 (D-082). A step without blocks is drawn planned
# until its first block (`add block`) arrives.
#
# 2026-10-27 (D-091, the user: "the roadmap is not updated, you should do
# this automatically"): S3's built blocks hang under their steps -- I16
# (Block 16: pool, acquisition check, selection, alignment, projection
# check) under S3, I17 (Block 17) under S3a, I18 (Block 18) under S3b, I19
# (Block 19) under S3c; every new SPEC block is added here in the same turn
# from now on. The hybrid renderer leaves "not scheduled" (D-084; the user:
# "GO on with the hybrid renderer"): NS2 is now HR, a step of its own, and
# S3d waits for it (D-085.11).
#
# 2026-10-27 (later): the hybrid built as SPEC Block 21 (Block 20 is S3d's),
# entered as I21 under HR in the same turn (D-091, D-092). T7 stays open (the
# user's to set).
#
# 2026-10-27 (table theory chat, the user: "The rest about the Stage 4 has
# been studied, update the roadmap"): T4 becomes a group of three topics, the
# split the theory chat made on 2026-10-22 (its commits were never pushed):
# T4.1 the table's design (T4's closed DRAFT carried), T4.2 Step 4, the grid
# value and its SE (closed: studied), T4.3 Step 5, the cubic read-out and the
# inversion (studying).
#
# Theory status: open | studying | closed  (set with
#   python specs/roadmap/roadmap.py set --yaml specs/roadmap/diameter-pipeline.yaml T6 closed --decision D-nnn)
# Implementation stages: block = the SPEC.md block; parent = the group the
# stage belongs to (a stage with members is drawn as a frame around them;
# a stage without a block is a pure group); needs_hpc = green only after an
# HPC run marked by specs/roadmap/hpc_status.sh; jobs = job script paths or
# PBS job names (-N) whose markers belong to the stage; summary = what the
# stage is about, in plain words.
schema: 1
name: diameter-pipeline
title: "Allen dendrite-diameter re-measurement (allen_diameter)"
repo: Leonardodm00/Towards-EEG
branch: sci/diameter-pipeline
spec: specs/SPEC.md
hpc_branch: hpc-status
stale_after_hours: 48      # a running HPC marker older than this is reported as failing

theory:
  # ---- groups (no status of their own; coloured by their least advanced member)
  - id: TG1
    title: "Image formation"
    summary: "How a dendrite in the stack becomes the image we measure: frames, the phantom and its rendering, and the optics of absorption and defocus."
    refs: []
    depends_on: []
  - id: TG2
    title: "Measuring a diameter at a node"
    summary: "What is extracted from the image at one node and how: the per-node chain, the tube fit and the SGT plane fit."
    refs: []
    depends_on: []
  - id: TG3
    title: "Correction and calibration"
    summary: "How a measured diameter is corrected and the kernel calibrated: the bias table and inversion, the far-field calibration."
    refs: []
    depends_on: []

  # ---- topics
  - id: T1
    title: "Frames and objects"
    summary: "Stack, node and camera frames; the objects the measurement works on (SPEC 2.1)."
    refs: [SPEC 2.1, handoff_diameter_remeasurement.md]
    parent: TG1
    depends_on: []
    status: closed        # DRAFT: Blocks 2-5 confirmed and smoke-tested; confirm or reopen
    closed_on: 2026-10-06
    decision:
  - id: T2
    title: "Per-node measurement"
    summary: "Profile sampling, focus rule, path, background and the tube fit at a node (SPEC 2.2, handoff Eqs. 1-5, 9)."
    refs: [SPEC 2.2, D-018, D-019, D-030]
    parent: TG2
    depends_on: [T1]
    status: closed        # DRAFT
    closed_on: 2026-10-07
    decision: D-030
  - id: T3
    title: "Phantom geometry and rendering"
