    refs: ["SPEC 2.4", D-024, D-057, D-058, D-059, D-060, D-061, D-062, D-063.1]
    parent: T4
    depends_on: [T2, T3]
    status: closed
    closed_on: 2026-10-21
    decision: D-071
    note: "Carried from T4's closed DRAFT (2026-10-21, D-071 settled the [to confirm] items of Block 14) when T4 was split into T4.1-T4.3 (theory chat, 2026-10-22; applied here 2026-10-27)."
  - id: T4.2
    title: "Step 4: the grid value and its SE"
    summary: "How each grid value is estimated (local linear fit), its bias and its noise at fixed rows, and the SE the table reports: the by-draw sandwich, as Block 14.4 codes it (residuals about the cubic read-out)."
    refs: [D-063.2, D-063.3, D-067.3, D-071.1, D-071.2, D-071.3, "theory handoff 2026-10-22 s.5-6.1"]
    parent: T4
    depends_on: [T4.1]
    status: closed
    closed_on: 2026-10-27
    decision:
    note: "Studied by the user (theory chat 2026-10-23 to 10-27). Left open, carried in the 2026-10-27 study handoff: 4c in part (few effective draws: the support floor counts rows, not draws), 4d (the CV's choice of c in the table's spread), 4e (a row's ratio and its x3 come from one fit), 4f (rho on the real design)."
  - id: T4.3
    title: "Step 5: the cubic read-out and the inversion"
    summary: "Reading the table between grid points (the tensor cubic spline and the SE read there) and inverting it at a real node: the root, its flags, and the error budget and SE of the corrected diameter."
    refs: [D-063.4, D-071.4, D5, "10-19 handoff s.5.3", "mathematics Eqs. 20-21", "theory handoff 2026-10-22 s.6.2"]
